<div class="max-w-6xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
  <div class="mb-8 border-b border-gray-200 pb-5">
    <h2 class="text-2xl font-bold text-gray-900">Gestión de Sucursales</h2>
    <p class="mt-1 text-sm text-gray-500">Administra las ubicaciones físicas o almacenes de tu tienda.</p>
  </div>

  <div class="bg-white shadow-sm rounded-lg border border-gray-200 p-6">
    
    <!-- Formulario de Sucursales -->
    <form (ngSubmit)="guardarSucursal()" class="flex flex-col md:flex-row gap-4 mb-8">
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de Sucursal</label>
        <input type="text" [(ngModel)]="nuevaSucursal.nombre" name="nombre" placeholder="Ej. Central, Norte, Mall..." required
          class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-black focus:border-black text-sm">
      </div>
      <div class="flex-[2]">
        <label class="block text-sm font-medium text-gray-700 mb-1">Dirección (Opcional)</label>
        <input type="text" [(ngModel)]="nuevaSucursal.direccion" name="direccion" placeholder="Ej. Av. Banzer 4to Anillo..."
          class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-black focus:border-black text-sm">
      </div>
      <div class="flex items-end">
        <button type="submit" [disabled]="!nuevaSucursal.nombre || cargando"
          class="w-full md:w-auto bg-black text-white px-6 py-2 rounded-md hover:bg-gray-800 disabled:bg-gray-400 text-sm font-medium transition-colors">
          {{ cargando ? 'Guardando...' : 'Agregar Sucursal' }}
        </button>
      </div>
    </form>

    <!-- Tabla de Sucursales -->
    <div class="border border-gray-100 rounded-md overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nombre</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Dirección</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 bg-white">
          @for (sucursal of sucursales; track sucursal.id) {
            <tr class="hover:bg-gray-50 transition-colors">
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">#{{ sucursal.id }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">{{ sucursal.nombre }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ sucursal.direccion || '---' }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="px-6 py-8 text-center text-sm text-gray-500">
                No hay sucursales registradas.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
