<!-- Formulario de Datos (Solo visible si no hay QR) -->
@if (!qrBase64) {
  <div>
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Detalles de Facturación y Envío</h2>
    
    <form (ngSubmit)="confirmarCompra()" class="space-y-6">
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre completo *</label>
        <input type="text" [(ngModel)]="cliente.nombre" name="nombre" required 
               class="w-full border border-gray-300 p-3 text-gray-900 focus:ring-black focus:border-black">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Correo electrónico *</label>
        <input type="email" [(ngModel)]="cliente.correo" name="correo" required 
               class="w-full border border-gray-300 p-3 text-gray-900 focus:ring-black focus:border-black">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono de contacto *</label>
        <input type="tel" [(ngModel)]="cliente.telefono" name="telefono" required 
               class="w-full border border-gray-300 p-3 text-gray-900 focus:ring-black focus:border-black">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Dirección de envío (Opcional si recoges en tienda)</label>
        <textarea [(ngModel)]="cliente.direccion" name="direccion" rows="3"
                  class="w-full border border-gray-300 p-3 text-gray-900 focus:ring-black focus:border-black"></textarea>
      </div>

      <button type="submit" [disabled]="procesando" 
              class="w-full bg-black text-white py-4 font-bold hover:bg-gray-800 transition-colors disabled:bg-gray-400">
        {{ procesando ? 'Generando QR Seguro...' : 'Pagar con QR (BCP)' }}
      </button>
    </form>
  </div>
} @else {
  <!-- PANTALLA DE PAGO QR (Aparece instantáneamente al recibir la respuesta) -->
  <div class="bg-gray-50 border border-gray-200 p-8 flex flex-col items-center justify-center text-center">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Escanea para Pagar</h2>
    <p class="text-gray-600 mb-6">Abre la aplicación de tu banco o billetera móvil y escanea este código.</p>
    
    <div class="border-4 border-black p-4 rounded-xl bg-white mb-6">
      <img [src]="'data:image/png;base64,' + qrBase64" alt="Código QR BCP" class="w-64 h-64 object-contain">
    </div>
    
    <div class="text-sm font-medium text-gray-900 bg-white px-4 py-2 border border-gray-200 rounded-full mb-6">
      Orden #{{ ordenId }} • Total a pagar: Bs. {{ total }}
    </div>

    <a href="/" class="text-gray-500 hover:text-black font-medium transition-colors underline">
      Volver a la tienda
    </a>
  </div>
}
