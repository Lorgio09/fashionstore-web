<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white p-10 rounded-none shadow-sm border border-gray-100 space-y-8">
    
    <!-- Encabezado -->
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900 tracking-tight">
        RECUPERAR <span class="text-gray-400">CLAVE</span>
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Ingresa tu correo y te enviaremos las instrucciones para restablecer tu acceso.
      </p>
    </div>

    <!-- Formulario -->
    <form class="mt-8 space-y-6" action="#" method="POST">
      <div class="rounded-md shadow-sm space-y-4">
        <!-- Campo Correo -->
        <div>
          <label for="email-address" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
          <input id="email-address" name="email" type="email" autocomplete="email" required 
            class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-black focus:border-black focus:z-10 sm:text-sm mt-1" 
            placeholder="ejemplo@correo.com">
        </div>
      </div>

      <!-- Botón de envío -->
      <div>
        <button type="submit" 
          class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-none text-white bg-black hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black transition-colors">
          Enviar enlace
        </button>
      </div>
    </form>

    <!-- Enlace a login -->
    <div class="text-center mt-4">
      <p class="text-sm text-gray-600">
        ¿Recordaste tu contraseña? 
        <a routerLink="/login" class="font-medium text-black hover:underline">
          Volver al inicio
        </a>
      </p>
    </div>

  </div>
</div>
