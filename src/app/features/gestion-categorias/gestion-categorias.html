<div class="max-w-5xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
  <div class="mb-8 border-b border-gray-200 pb-5">
    <h2 class="text-2xl font-bold text-gray-900">Gestión de Categorías</h2>
    <p class="mt-1 text-sm text-gray-500">Administra las clasificaciones de tus prendas.</p>
  </div>

  <div class="bg-white shadow-sm rounded-lg border border-gray-200 p-6">
    
    <!-- Formulario Rápido -->
    <form (ngSubmit)="guardarCategoria()" class="flex flex-col sm:flex-row gap-4 mb-8">
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de la Categoría</label>
        <input type="text" [(ngModel)]="nuevaCategoria.nombre" name="nombre" placeholder="Ej. Chaquetas, Poleras, Pantalones..." required
          class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-black focus:border-black text-sm">
      </div>
      <div class="flex items-end">
        <button type="submit" [disabled]="!nuevaCategoria.nombre || cargando"
          class="w-full sm:w-auto bg-black text-white px-6 py-2 rounded-md hover:bg-gray-800 disabled:bg-gray-400 text-sm font-medium transition-colors">
          {{ cargando ? 'Guardando...' : 'Agregar Categoría' }}
        </button>
      </div>
    </form>

    <!-- Tabla de Categorías -->
    <div class="border border-gray-100 rounded-md overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nombre de la Categoría</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 bg-white">
          @for (categoria of categorias; track categoria.id) {
            <tr class="hover:bg-gray-50 transition-colors">
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">#{{ categoria.id }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">{{ categoria.nombre }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="2" class="px-6 py-8 text-center text-sm text-gray-500">
                No hay categorías registradas.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
