<div class="max-w-5xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
  <div class="mb-8 border-b border-gray-200 pb-5">
    <h2 class="text-2xl font-bold text-gray-900">Gestión de Proveedores</h2>
    <p class="mt-1 text-sm text-gray-500">Administra las marcas y fabricantes que suministran tus prendas.</p>
  </div>

  <div class="bg-white shadow-sm rounded-lg border border-gray-200 p-6">
    
    <!-- Formulario rápido -->
    <form (ngSubmit)="guardarProveedor()" class="flex flex-col sm:flex-row gap-4 mb-8">
      <div class="flex-1">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Proveedor / Marca</label>
        <input type="text" [(ngModel)]="nuevoProveedor.nombre" name="nombre" placeholder="Ej. Adidas, Nike, Zara..." required
          class="block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-black focus:border-black text-sm">
      </div>
      <div class="flex items-end">
        <button type="submit" [disabled]="!nuevoProveedor.nombre || cargando"
          class="w-full sm:w-auto bg-black text-white px-6 py-2 rounded-md hover:bg-gray-800 disabled:bg-gray-400 text-sm font-medium transition-colors">
          {{ cargando ? 'Guardando...' : 'Agregar Proveedor' }}
        </button>
      </div>
    </form>

    <!-- Tabla de Proveedores -->
    <div class="border border-gray-100 rounded-md overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nombre / Marca</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Estado</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 bg-white">
          @for (proveedor of proveedores; track proveedor.id) {
            <tr class="hover:bg-gray-50 transition-colors">
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">#{{ proveedor.id }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">{{ proveedor.razon_social }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-right">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                  Activo
                </span>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="px-6 py-8 text-center text-sm text-gray-500">
                No hay proveedores registrados.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
