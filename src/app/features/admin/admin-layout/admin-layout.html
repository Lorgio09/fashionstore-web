<div class="flex h-screen bg-gray-100">

  <!-- Menú Lateral (Sidebar) -->
  <aside class="w-64 bg-black text-white flex flex-col">
    <div class="h-16 flex items-center justify-center border-b border-gray-800">
      <h1 class="text-xl font-extrabold tracking-tight">FASHION<span class="text-gray-500">STORE</span></h1>
    </div>
    
    <nav class="flex-1 overflow-y-auto py-4">
      <ul class="space-y-0.5 px-2">
        <li>
          <a routerLink="/admin/dashboard" routerLinkActive="bg-white text-black" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-900 hover:text-white transition-colors">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3 1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5m.75-9 3-3 2.148 2.148A12.061 12.061 0 0 1 16.5 7.605" />
            </svg>
            Dashboard
          </a>
        </li>

        <!-- Gestión Principal -->
        <li class="pt-5 pb-2 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Inventario</li>
        <li>
          <a routerLink="/admin/entrada-inventario" routerLinkActive="bg-white text-black" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-900 hover:text-white transition-colors">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m4.06-7.19-7.5 4.33A2.25 2.25 0 0 0 4.5 8.427v7.146a2.25 2.25 0 0 0 1.06 1.91l7.5 4.33a2.25 2.25 0 0 0 2.25 0l7.5-4.33a2.25 2.25 0 0 0 1.06-1.91V8.427a2.25 2.25 0 0 0-1.06-1.91l-7.5-4.33a2.25 2.25 0 0 0-2.25 0Z" />
            </svg>
            Entrada de Stock
          </a>
        </li>
        <li>
          <a routerLink="/admin/prendas" routerLinkActive="bg-white text-black" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-900 hover:text-white transition-colors">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5-3-3m0 0-3 3m3-3v11.25m6-2.25 3 3m0 0 3-3m-3 3V6.75m-13.5 0h16.5" />
            </svg>
            Productos (Prendas)
          </a>
        </li>
        <li>
          <a routerLink="/admin/categorias-tallas" routerLinkActive="bg-white text-black" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-900 hover:text-white transition-colors">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z" />
            </svg>
            Categorías
          </a>
        </li>
        <li>
          <a routerLink="/admin/temporadas" routerLinkActive="bg-white text-black" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-900 hover:text-white transition-colors">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
            </svg>
            Temporadas
          </a>
        </li>
        <li>
          <a routerLink="/admin/colecciones" routerLinkActive="bg-white text-black" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-900 hover:text-white transition-colors">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-19.5 0v6a2.25 2.25 0 0 0 2.25 2.25h15a2.25 2.25 0 0 0 2.25-2.25v-6m-19.5 0h19.5M12 6.75h.008v.008H12V6.75Z" />
            </svg>
            Colecciones
          </a>
        </li>
        
        <!-- Gestión Estructural -->
        <li class="pt-5 pb-2 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider">Administración</li>
        <li>
          <a routerLink="/admin/sucursales" routerLinkActive="bg-white text-black" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-900 hover:text-white transition-colors">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21" />
            </svg>
            Sucursales
          </a>
        </li>
        <li>
          <a routerLink="/admin/proveedores" routerLinkActive="bg-white text-black" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-900 hover:text-white transition-colors">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5-3-3m0 0-3 3m3-3v11.25m6-2.25 3 3m0 0 3-3m-3 3V6.75m-13.5 0h16.5" />
            </svg>
            Proveedores
          </a>
        </li>
        <li>
          <a routerLink="/admin/gestion-usuarios" routerLinkActive="bg-white text-black" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-900 hover:text-white transition-colors">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z" />
            </svg>
            Usuarios y Roles
          </a>
        </li>
        <li>
          <a routerLink="/admin/auditoria" routerLinkActive="bg-white text-black" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-300 hover:bg-gray-900 hover:text-white transition-colors">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
            </svg>
            Auditoría
          </a>
        </li>
      </ul>
    </nav>
    
    <div class="p-4 border-t border-gray-800">
      <button (click)="cerrarSesion()" class="cursor-pointer w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-400 hover:bg-gray-900 hover:text-white transition-colors">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25" />
        </svg>
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- Área Principal -->
  <div class="flex-1 flex flex-col overflow-hidden">
    
    <!-- Encabezado (Header) -->
    <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 z-10">
      <h2 class="text-xl font-bold text-gray-900 tracking-tight">Panel de Administración</h2>
      <div class="flex items-center gap-3">
        <span class="text-sm font-medium text-gray-600">Admin</span>
        <div class="h-9 w-9 rounded-full bg-black text-white flex items-center justify-center text-sm font-bold">
          A
        </div>
      </div>
    </header>

    <!-- Contenido Dinámico -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
      <router-outlet></router-outlet>
    </main>
    
  </div>
</div>
