<div class="max-w-4xl mx-auto py-8 px-4">
  <div class="mb-8 border-b border-gray-200 pb-5">
    <h2 class="text-2xl font-bold text-gray-900">Gestión de Colecciones</h2>
  </div>

  <div class="bg-white shadow-sm rounded-lg border border-gray-200 p-6 mb-8">
    <form (ngSubmit)="guardarColeccion()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
          <input type="text" [(ngModel)]="nuevaColeccion.nombre" name="nombre" required
            class="block w-full border border-gray-300 rounded-md py-2 px-3">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
          <input type="text" [(ngModel)]="nuevaColeccion.descripcion" name="descripcion"
            class="block w-full border border-gray-300 rounded-md py-2 px-3">
        </div>
      </div>
      <div class="flex justify-end">
        <button type="submit" [disabled]="!nuevaColeccion.nombre || cargando"
          class="bg-black text-white px-6 py-2 rounded-md hover:bg-gray-800 disabled:bg-gray-400">
          Guardar Colección
        </button>
      </div>
    </form>
  </div>

  <div class="bg-white border border-gray-100 rounded-lg overflow-hidden shadow-sm">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nombre</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Descripción</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 bg-white">
        @for (col of colecciones; track col.id) {
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ col.nombre }}</td>
            <td class="px-6 py-4 text-sm text-gray-500">{{ col.descripcion || '-' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
